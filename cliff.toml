# NOTE: The body/footer templates use careful `-%` whitespace control and
#  `trim = false` because `trim = true` strips trailing newlines from each
#  rendered body, collapsing the blank line between release sections.
#  The `postprocessors` regex collapses 3+ consecutive newlines into exactly 2
#  (one blank line), which satisfies markdownlint MD012 (no-multiple-blanks)
#  and MD022/MD032 (blanks-around-headings/lists).
#  Footer wraps URLs in `<...>` to satisfy markdownlint MD034 (no-bare-urls).

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
"""
body = """{%- macro remote_url() -%}
  https://github.com/Danipulok/pydantic-jsonschema
{%- endmacro -%}

## [{% if version %}{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{%- endfor %}
"""
footer = """{%- macro remote_url() -%}
  https://github.com/Danipulok/pydantic-jsonschema
{%- endmacro -%}
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: <{{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}>
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: <{{ self::remote_url() }}/releases/tag/{{ release.version }}>
{% endif -%}
{% else -%}
{% if release.previous.version -%}
[Unreleased]: <{{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD>
{% endif -%}
{% endif -%}
{% endfor -%}
"""
trim = false
postprocessors = [
  { pattern = "\n{3,}", replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Other" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "Build" },
  { message = "^chore", group = "Other" },
  { message = "^revert", group = "Reverted" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
sort_commits = "newest"

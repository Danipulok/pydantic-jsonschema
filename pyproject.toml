[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-jsonschema"
version = "0.1.0"
description = "JSON Schema to Pydantic model conversion library"
authors = [
    {name = "Danipulok", email = "danipulok@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = [
    "pydantic",
    "json-schema",
    "validation",
    "type-safety",
    "schema",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openapi-pydantic>=0.5.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Danipulok/pydantic-jsonschema"
Documentation = "https://danipulok.github.io/pydantic-jsonschema/"
Repository = "https://github.com/Danipulok/pydantic-jsonschema"
Issues = "https://github.com/Danipulok/pydantic-jsonschema/issues"
Changelog = "https://github.com/Danipulok/pydantic-jsonschema/blob/main/CHANGELOG.md"

[project.optional-dependencies]
formats-base = [
    "email-validator>=2.0.0",
    "fqdn",
    "rfc3986>=2.0.0",
]
formats-extra = [
    "pydantic-extra-types[all] @ git+https://github.com/Danipulok/pydantic-extra-types.git@refactor/s3",
]
formats-all = [
    # `formats-base`
    "email-validator>=2.0.0",
    "fqdn",
    "rfc3986>=2.0.0",
    # `formats-extra`
    "pydantic-extra-types[all] @ git+https://github.com/Danipulok/pydantic-extra-types.git@refactor/s3",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
]
lint = [
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "ruff>=0.12.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-examples @ git+https://github.com/Danipulok/pytest-examples.git@feat/windows-compatible",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.5.45",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings-python>=1.12.2",
]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in `__init__`
    "D203",     # 1 blank line required before class docstring
    "D213",     # Multi-line docstring summary should start at the second line

    "FIX002",   # Line contains _TODO, consider resolving the issue
    "TD002",    # Missing author in _TODO
    "TD003",    # Missing issue link on the line following this _TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of `assert` detected
]
"examples/*" = [
    "T201",     # Remove `print`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",     # Raise error for unregistered markers
    "--strict-config",      # Raise error for unknown config options
]

# https://coverage.readthedocs.io/en/latest/config.html#run
[tool.coverage.run]
branch = true       # Enable branch coverage in addition to statement coverage
parallel = true     # Allow parallel coverage runs for multi-version testing
source = ["pydantic_jsonschema"]
omit = ["tests/*"]

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
fail_under = 100
skip_covered = true # Omit fully covered files from report output
show_missing = true # Show line numbers of missing coverage in report
precision = 2       # Number of decimal places in coverage percentages
exclude_lines = [
    "pragma: no cover",     # Standard marker to exclude line from coverage
    "except ImportError.*", # Import guards for optional dependencies
    "\\(Protocol\\):$",     # Do not count Protocol definitions
]

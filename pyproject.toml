[project]
name = "pydantic-jsonschema"
version = "0.1.0"
description = "JSON Schema to Pydantic model conversion library"
requires-python = ">=3.13"
dependencies = [
    "openapi-pydantic>=0.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
formats = [
    "pydantic-extra-types[all]>=2.0.0",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "extas"},
]
lint = [
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "ruff>=0.12.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
extas = [
    "pydantic-extra-types[all]>=2.0.0",
]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_expr = false
warn_return_any = false
disable_error_code = ["no-untyped-def", "call-overload", "index", "call-arg", "comparison-overlap", "type-arg", "dict-item", "unused-ignore"]

[[tool.mypy.overrides]]
module = "pydantic_jsonschema.formats.extra"
disable_error_code = ["arg-type"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in `__init__`
    "D203",     # 1 blank line required before class docstring
    "D213",     # Multi-line docstring summary should start at the second line

    "FIX002",   # Line contains _TODO, consider resolving the issue
    "TD002",    # Missing author in _TODO
    "TD003",    # Missing issue link on the line following this _TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of `assert` detected
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",  # Raise error for unregistered markers
    "--strict-config",  # Raise error for unknown config options
]

[tool.coverage.run]
source = ["pydantic_jsonschema"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

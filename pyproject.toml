[project]
name = "pydantic-jsonschema"
dynamic = ["version"]
description = "JSON Schema to Pydantic model conversion library"
authors = [
    {name = "Danipulok", email = "danipulok@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = [
    "pydantic",
    "json-schema",
    "validation",
    "type-safety",
    "schema",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # NOTE: `2.12.0` is the floor for `pydantic.experimental.missing_sentinel`,
    # but `2.12.x` emits `PydanticSerializationUnexpectedValue` warnings on every
    # `Schema.model_dump()` with nested schemas. Clean from `2.13.0`.
    #
    # Reproduce on `2.12.5`:
    #   uv run --with 'pydantic==2.12.5' -m pytest -q
    #   # -> 449 passed, 5 warnings (Expected 'MISSING' sentinel)
    "pydantic>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/Danipulok/pydantic-jsonschema"
Documentation = "https://danipulok.github.io/pydantic-jsonschema/"
Repository = "https://github.com/Danipulok/pydantic-jsonschema"
Issues = "https://github.com/Danipulok/pydantic-jsonschema/issues"
Changelog = "https://github.com/Danipulok/pydantic-jsonschema/blob/main/docs/changelog.md"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "release"},
]
release = [
    "git-cliff>=2.0.0",
]
lint = [
    "codespell>=2.4.0",
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "ruff>=0.12.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.18",
    # NOTE: Used in `docs/formats.md` examples, which are executed by `tests/test_docs.py`.
    #       Base package only — examples use `Color` and `PaymentCardNumber`, which need no extras.
    "pydantic-extra-types",
]
docs = [
    "mike>=2.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.5.45",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings-python>=1.12.2",
]

# NOTE: Supply-chain safety net — only resolve packages published at least
# 7 days ago so a compromised or typo-squatted release has time to be caught
# and yanked before it lands in our lockfile.
[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pydantic_jsonschema/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "pydantic_jsonschema/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_jsonschema"]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["check_.*\\.py$", "mre_.*\\.py$", "pydantic_mre\\.py$"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # Conflicts with `ruff format`
    "D203",     # Conflicts with D211 (no blank line before class docstring)
    "D213",     # Conflicts with D212 (summary on first line)

    "FIX002",   # Line contains _TODO, consider resolving the issue
    "TD002",    # Missing author in _TODO
    "TD003",    # Missing issue link on the line following this _TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of `assert` detected
]
"tests/formats/test_uri.py" = [
    "RUF001",   # Ambiguous unicode (intentional in IRI test data)
]
"examples/*" = [
    "T201",     # Remove `print`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",     # Raise error for unregistered markers
    "--strict-config",      # Raise error for unknown config options
]

# https://coverage.readthedocs.io/en/latest/config.html#run
[tool.coverage.run]
branch = true       # Enable branch coverage in addition to statement coverage
parallel = true     # Allow parallel coverage runs for multi-version testing
source = ["pydantic_jsonschema"]
omit = ["tests/*"]

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
fail_under = 100
skip_covered = true # Omit fully covered files from report output
show_missing = true # Show line numbers of missing coverage in report
precision = 2       # Number of decimal places in coverage percentages
exclude_lines = [
    "\\(Protocol\\):$",     # Do not count Protocol definitions
]

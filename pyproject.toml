[project]
name = "pydantic-jsonschema"
dynamic = ["version"]
description = "JSON Schema to Pydantic model conversion library"
authors = [
    {name = "Danipulok", email = "danipulok@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = [
    "pydantic",
    "json-schema",
    "validation",
    "type-safety",
    "schema",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # NOTE: `2.12.0` is the floor for `pydantic.experimental.missing_sentinel`,
    # but `2.12.x` emits `PydanticSerializationUnexpectedValue` warnings on every
    # `Schema.model_dump()` with nested schemas. Clean from `2.13.0`.
    #
    # Reproduce on `2.12.5`:
    #   uv run --with 'pydantic==2.12.5' -m pytest -q
    #   # -> 449 passed, 5 warnings (Expected 'MISSING' sentinel)
    "pydantic>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/Danipulok/pydantic-jsonschema"
Documentation = "https://danipulok.github.io/pydantic-jsonschema/"
Repository = "https://github.com/Danipulok/pydantic-jsonschema"
Issues = "https://github.com/Danipulok/pydantic-jsonschema/issues"
Changelog = "https://github.com/Danipulok/pydantic-jsonschema/blob/main/docs/changelog.md"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "benchmark"},
    {include-group = "docs"},
    {include-group = "release"},
    {include-group = "audit"},
]
# `pytest-codspeed` provides the `benchmark` fixture and powers the `CodSpeed` CI job. Kept out of
# the `test` group so the coverage-gated suite never pulls it (and the floor/ceiling runs stay lean).
benchmark = [
    {include-group = "test"},
    "pytest-codspeed>=5.0.0",
]
# `zizmor` audits the workflows. Kept in its own group so CI's `Audit` job — deliberately
#  independent of `lint`/`test` — installs this one tool instead of the whole lint env. Locked
#  rather than run through `uvx`: a floating `uvx zizmor` gets none of the supply-chain guards the
#  rest of the tree has — no `exclude-newer` cooldown, no lockfile hash, no `Dependabot` bump.
audit = [
    "zizmor>=1.29.0",
]
release = [
    "git-cliff>=2.0.0",
]
lint = [
    "codespell>=2.4.0",
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "pyright[nodejs]>=1.1.409",
    "ruff>=0.12.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.18",
    # NOTE: Used in `docs/formats.md` examples, which are executed by `tests/test_docs.py`.
    #       Base package only — examples use `Color` and `PaymentCardNumber`, which need no extras.
    #       `2.0.0`-`2.2.0` work but use deprecated `pydantic-core` APIs; clean from `2.3.0`.
    #
    # Reproduce on `2.2.0`:
    #   uv run --with 'pydantic-extra-types==2.2.0' -m pytest tests/test_docs.py -q
    #   # -> 35 passed, 4 warnings (`general_after_validator_function` is deprecated)
    "pydantic-extra-types>=2.3.0",
    "inline-snapshot>=0.34.0",
]
docs = [
    "mike>=2.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.5.45",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings-python>=1.12.2",
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-copy-to-llm>=0.2.10",
]

# NOTE: Supply-chain safety net — only resolve packages published at least
# 7 days ago so a compromised or typo-squatted release has time to be caught
# and yanked before it lands in our lockfile.
#
# This is the canonical cutoff. It is mirrored as `cooldown.default-days` in
# `.github/dependabot.yml` (Dependabot ignores `exclude-newer`) — keep both in sync.
[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "pydantic_jsonschema/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_jsonschema"]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]
strict = true
strict_bytes = true
local_partial_types = true
warn_return_any = true
warn_unused_configs = true
# NOTE: `warn_unreachable` and the `redundant-expr` code are intentionally NOT enabled — the
# `X | MISSING` sentinel fields (see `schema/_models.py`) defeat mypy's flow analysis (it doesn't
# model `MISSING` as a type), so both flag dozens of false "unreachable" / "always true|false"
# errors. Same root cause as the per-file `comparison-overlap` disables.
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
    "deprecated",
]
files = ["pydantic_jsonschema", "tests", "examples"]

# Second type checker alongside `mypy`: the two disagree often enough that running both
# catches issues neither finds alone (e.g. `pyright` flagged the `examples/custom_formats.py`
# alias that used bare `X = Annotated[...]` instead of the canonical `type X = ...`).
#
# `tests` are intentionally excluded: `pyright` has no Pydantic plugin, so it (a) cannot resolve
# field aliases (`$ref`, `if_`, `else_`, `not_`) and (b) flags the deliberate "wrong" inputs our
# validation tests feed to coercing fields. `mypy` (with `pydantic.mypy`) covers `tests`.
[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# Scoped to the library source. `tests` and `examples` *consume* the models that `to_model`
# builds at runtime, whose attributes/types are unknowable statically (`post.comments`,
# `Reference(ref=...)` wanting the `$ref` alias, raw strings fed to coercing fields) — `pyright`
# can only add `# pyright: ignore` noise there. `mypy` (+ `pydantic.mypy`) already covers both.
include = ["pydantic_jsonschema"]
# `# type: ignore` belongs to `mypy`; `pyright` uses `# pyright: ignore`. Without this, `pyright`
# flags `mypy`-only ignores as unnecessary (and vice versa) when both checkers run.
enableTypeIgnoreComments = false
reportUnusedImport = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
reportMatchNotExhaustive = "error"
reportPrivateUsage = "error"
reportMissingTypeStubs = "error"
reportUnknownLambdaType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportDeprecated = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["pydantic_jsonschema/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # Conflicts with `ruff format`
    "D203",     # Conflicts with D211 (no blank line before class docstring)
    "D213",     # Conflicts with D212 (summary on first line)

    "FIX002",   # Line contains _TODO, consider resolving the issue
    "TD002",    # Missing author in _TODO
    "TD003",    # Missing issue link on the line following this _TODO

    # Per-file copyright headers are not this project's convention — the root `LICENSE` covers
    # everything. The rule was preview-only (so `ALL` skipped it) until `ruff` `0.16.0` stabilized
    # it, at which point it flagged every single module.
    #
    # Reproduce on `ruff` `0.16.0` without this entry:
    #   uv run ruff check
    #   # -> CPY001 Missing copyright notice at top of file (x69)
    "CPY001",   # Missing copyright notice at top of file
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of `assert` detected
]
"tests/applicators/test_dependent_schemas.py" = [
    "E501",     # Long lines in `inline_snapshot` literals (Pydantic error messages)
]
"tests/applicators/test_pattern_properties.py" = [
    "E501",     # Long lines in `inline_snapshot` literals (Pydantic error messages)
]
"tests/applicators/test_property_names.py" = [
    "E501",     # Long lines in `inline_snapshot` literals (Pydantic error messages)
]
"tests/converters/test_discriminator.py" = [
    "E501",     # Long lines in `inline_snapshot` literals (Pydantic error messages)
]
"pydantic_jsonschema/formats/_types.py" = [
    "E501",     # Long spec URLs in format-alias attribute docstrings
]
"pydantic_jsonschema/schema/_models.py" = [
    "E501",     # Long spec URLs in `Schema` field attribute docstrings
]
"tests/formats/test_hostname.py" = [
    "RUF001",   # Ambiguous unicode (intentional in IDN hostname test data)
]
"tests/formats/test_uri.py" = [
    "RUF001",   # Ambiguous unicode (intentional in IRI test data)
]
"examples/*" = [
    "T201",     # Remove `print`
]

# Manually read by `tests/test_docs.py` (`pytest-examples` has no native `pyproject.toml` support).
[tool.pytest-examples]
ruff-ignore = [
    "T201",     # Remove `print`
    "D",        # Missing docstrings (doc blocks are fragments, no module to document)
    "PLR2004",  # Magic values in comparisons (e.g. `len(parts) != 3` in `docs/formats.md`)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",     # Raise error for unregistered markers
    "--strict-config",      # Raise error for unknown config options
    # Benchmarks (`tests/benchmarks/`) need `pytest-codspeed` and run only in the `CodSpeed` job,
    # which overrides this with `-m benchmark`. Excluding them here keeps the normal suite plugin-free
    # and out of the 100% coverage gate.
    "-m", "not benchmark",
]
markers = [
    "benchmark: performance benchmark executed under `CodSpeed`; excluded from the normal suite",
]
xfail_strict = true         # An `xfail` test that unexpectedly passes is a failure
filterwarnings = ["error"]  # Any warning is an error — catches deprecations early (e.g. in the
                            # dependency-ceiling run); add targeted `ignore::...` entries if a
                            # third-party warning is genuinely out of our control

# https://coverage.readthedocs.io/en/latest/config.html#run
[tool.coverage.run]
branch = true       # Enable branch coverage in addition to statement coverage
parallel = true     # Allow parallel coverage runs for multi-version testing
source = ["pydantic_jsonschema"]
omit = ["tests/*"]

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
fail_under = 100
skip_covered = true # Omit fully covered files from report output
show_missing = true # Show line numbers of missing coverage in report
precision = 2       # Number of decimal places in coverage percentages

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ --maxkb=500 ]
      - id: check-ast
      - id: check-case-conflict
      # NOTE: `check-docstring-first` is intentionally omitted — it misreads PEP 224
      #  attribute docstrings (strings after assignments in `schema/_models.py` / `formats/_types.py`)
      #  as a second module docstring and aborts the commit.
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        exclude: mkdocs.yml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: name-tests-test
        args: [ --pytest-test-first ]
      - id: pretty-format-json
        args: [ --autofix, --indent=4, --no-ensure-ascii, --no-sort-keys ]
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]

  # Validate GitHub Actions workflows and the Dependabot config against their JSON schemas.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-dependabot

  # Deep static analysis of the workflows (expression errors, deprecated syntax, shellcheck).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # `pre-commit`'s own meta hook: flag `exclude` patterns that no longer match any file.
  #  NOTE: `check-hooks-apply` is intentionally omitted — it would force removing the standard
  #  safety hooks (`check-json` / `check-xml` / ...) that currently match no files but are kept
  #  as cheap insurance for when such files appear.
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: local
    hooks:
      - id: format
        name: Format
        entry: just
        args: [format]
        language: system
        types: [python]
        pass_filenames: false

      - id: lint
        name: Lint
        entry: just
        args: [lint]
        language: system
        always_run: true
        pass_filenames: false

      - id: test
        name: Test
        entry: just
        args: [test]
        language: system
        always_run: true
        pass_filenames: false

      - id: docs-build
        name: Docs
        entry: just
        args: [docs-build]
        language: system
        always_run: true
        pass_filenames: false

      # NOTE: No dependency-CVE hook here on purpose. `just scan-deps` runs `trivy`
      #  via docker (image + DB pull), which is far too heavy for every commit; the
      #  frozen CVE gate lives in CI's `Audit` job and is available on demand as
      #  `just scan-deps`. The workflow audit below (`zizmor`) is cheap, so it stays.
      - id: audit-workflows
        name: Audit workflows
        entry: just
        args: [audit-workflows]
        language: system
        always_run: true
        pass_filenames: false

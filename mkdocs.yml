site_name: Pydantic JSON Schema
site_description: Convert JSON Schema to Pydantic models with type-safe validation
site_url: https://danipulok.github.io/pydantic-jsonschema
repo_url: https://github.com/danipulok/pydantic-jsonschema
repo_name: danipulok/pydantic-jsonschema
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    annotation: material/arrow-right-circle

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/danipulok/pydantic-jsonschema
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydantic-jsonschema/
  generator: false

copyright: Copyright &copy; 2026 - Present

nav:
  - Home: index.md
  - Installation: install.md
  - Schema: schema.md
  - Converters: converters.md
  - Applicators: applicators.md
  - Formats: formats.md
  - Examples: examples.md
  - API Reference:
    - Schema model: api/schema.md
    - Converters: api/converters.md
    - Applicators: api/applicators.md
    - Formats: api/formats.md
    - Exceptions: api/exceptions.md
  - Development:
    - Contributing: contributing.md
    - Changelog: changelog.md

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - glightbox
  # LLM-friendly export: `/llms.txt`, `/llms-full.txt`, and per-page `.md` files.
  - llmstxt:
      markdown_description: >-
        Convert JSON Schema definitions into Pydantic models with runtime validation.
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - install.md
          - schema.md
          - converters.md
          - formats.md
          - examples.md
        API reference:
          - api/*.md
        Development:
          - contributing.md
          - changelog.md
  # "Copy page as Markdown" split button (copy / view / open in ChatGPT / open in Claude).
  - copy-to-llm:
      button_hover_color: "var(--md-primary-fg-color)"
      buttons:
        copy_page: true
        view_as_markdown: true
        open_in_chatgpt: true
        open_in_claude: true
        # Niche — a Markdown link to the page is rarely what readers want.
        copy_markdown_link: false
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            merge_init_into_class: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            separate_signature: true
            line_length: 80
            show_source: false
            members_order: source
            show_bases: true
            # Hide implementation noise: raw attribute values, `type` alias values
            # (`Email = Annotated[...]`), and the `module-attribute` / `class-attribute` badges.
            show_attribute_values: false
            show_value: false
            show_labels: false
            show_root_heading: false
            show_root_toc_entry: false
            show_object_full_path: false
            show_category_heading: false
            show_if_no_docstring: false
            inherited_members: false
            group_by_category: true
            summary: false
            # `model_config` has no docstring, but the `types` page turns on
            # `show_if_no_docstring` to list `Schema` fields, so filter it out there.
            filters:
              - "!^_"
              - "!^model_config$"

watch:
  - pydantic_jsonschema

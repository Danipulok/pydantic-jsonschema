name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: grant nothing by default, scope per job below.
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: a release publishes artifacts, and a poisoned cache could tamper with them.
      - name: Install `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # `just build` runs `twine check` from the locked `release` group, and `UV_NO_SYNC` is on
      #  in CI, so nothing installs it implicitly.
      - name: Install dependencies
        run: just install-release

      - name: Build sdist and wheel
        run: just build

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to `PyPI`
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # PEP 740 build attestations (sigstore-signed provenance for each artifact). Already the
      # default in v1.14.0, but pinned explicitly so a future default change can't silently drop
      # release provenance. Requires Trusted Publishing + `id-token: write` (set on this job).
      - name: Publish distribution to `PyPI`
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  smoke-test:
    name: Smoke-test the published package
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      # PyPI needs a moment to make a fresh upload installable.
      - name: Wait for `PyPI` to propagate the release
        run: sleep 30

      - name: Install from `PyPI` and verify
        run: just smoke-test "${GITHUB_REF_NAME#v}"

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: a release publishes artifacts, and a poisoned cache could tamper with them.
      - name: Install `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just install-release

      - name: Generate release notes
        run: just release-notes /tmp/release-notes.md

      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # NOTE: `softprops/action-gh-release` is the established release-notes/upload path, so the
      #       `superfluous-actions` suggestion to use `gh release` is intentionally ignored.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.1  # zizmor: ignore[superfluous-actions]
        with:
          body_path: /tmp/release-notes.md
          files: dist/*

  deploy-docs:
    name: Deploy documentation
    needs: [github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # NOTE: `persist-credentials` stays on — `ci-docs-deploy` force-pushes the built site to the
      #       `gh-pages` branch, which needs the checkout's token. Hence the `artipacked` ignore.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # No cache: a release publishes artifacts, and a poisoned cache could tamper with them.
      - name: Install `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just install-docs

      - name: Deploy versioned documentation
        run: just ci-docs-deploy "${GITHUB_REF_NAME#v}"

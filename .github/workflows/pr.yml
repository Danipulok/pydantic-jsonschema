name: PR

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      # NOTE: PR title must follow Conventional Commits because squash-merge
      #       uses it as the commit message, and `git-cliff` parses it for
      #       the changelog. Non-conforming titles are silently dropped.
      - name: Check Conventional Commits format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            style
            build
            ci
            revert
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a description after the type."

name: PR

# NOTE: `pull_request_target` is required so the title check works on PRs from
#       forks (it needs the base-repo token to read PR metadata). This workflow
#       never checks out or runs untrusted PR code, so the elevated context is
#       safe — hence the `dangerous-triggers` suppression.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

# Cancel superseded runs: a new push to the same ref aborts the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      # NOTE: PR title must follow Conventional Commits because squash-merge
      #       uses it as the commit message, and `git-cliff` parses it for
      #       the changelog. Non-conforming titles are silently dropped.
      - name: Check Conventional Commits format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            style
            build
            ci
            revert
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a description after the type."

name: Refresh dependency lock

# Monthly full relock of the transitive dependency tree. Dependabot only bumps deps it has an
#  advisory or version signal for; this keeps the rest of the locked graph from drifting stale and
#  surfaces routine transitive updates (and any new CVE) as a single reviewable PR.
on:
  schedule:
    # 05:00 UTC on the 1st of each month (mirrors the cadence of a Renovate `lockFileMaintenance`).
    - cron: "0 5 1 * *"
  workflow_dispatch:

# The branch push and the PR both go through the App token minted below, so the workflow's own
#  token only has to read the repository for the checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Relock and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      # `uv lock --upgrade` refreshes the whole transitive tree. `tool.uv.exclude-newer` ("7 days")
      #  still applies, so nothing inside the supply-chain quarantine window is pulled in.
      - name: Upgrade lockfile
        run: uv lock --upgrade

      # `GITHUB_TOKEN` cannot open a mergeable PR here, in either configuration. Its plain push
      #  writes an unsigned commit and `main` requires verified signatures (#124:
      #  `verified=false, reason=unsigned`). Turning on `sign-commits` fixes that but makes the PR
      #  bot-authored, and a first-time author leaves every workflow `action_required`, so the
      #  required `CI ok` is never reported (#127). An App token signs through the API and its
      #  events start workflow runs normally, which closes both halves.
      #  https://github.com/peter-evans/create-pull-request/blob/5f6978faf089d4d20b00c7766989d076bb2fc7f1/docs/concepts-guidelines.md
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # Narrowed to what the step below needs — an unscoped token carries every permission the
          #  App is installed with. https://docs.zizmor.sh/audits/#github-app
          permission-contents: write
          permission-pull-requests: write

      # No-op when the lock is unchanged; otherwise reuses the `chore/lock-refresh` branch and
      #  updates the existing PR in place.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: uv.lock
          # Commits through the API so the result carries a verified signature.
          sign-commits: true
          branch: chore/lock-refresh
          delete-branch: true
          commit-message: "chore(deps): refresh transitive dependency lock"
          title: "chore(deps): refresh transitive dependency lock"
          labels: dependencies
          body: |
            Automated monthly `uv lock --upgrade` — refreshes the transitive dependency tree.

            `tool.uv.exclude-newer` ("7 days") still applies, so no release younger than the
            supply-chain quarantine window is included. Review the diff and merge if CI is green.

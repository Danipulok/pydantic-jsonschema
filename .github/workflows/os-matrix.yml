name: OS matrix

# Manual-only cross-OS sanity sweep (e.g. before a release). Not run on PRs: this library has no
# OS-specific runtime surface (pure in-memory schema -> model logic; no file I/O, paths, or
# subprocess), so per-PR cross-OS testing is not worth the cost — the PR matrix stays ubuntu-only.
# PyPy is omitted: its latest is 3.11, below our `requires-python = ">=3.12"`.
# 3.15 is omitted: it is a prerelease that builds `pydantic-core` from source (no wheel) on every
# OS, and it is already covered on ubuntu by the main CI.
on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs: a new dispatch on the same ref aborts the in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Subset of the canonical `ci.yml` `test` matrix — `3.15` omitted (see the file header).
        python-version: ["3.12", "3.13", "3.14"]
    # `UV_PYTHON` pins `uv` to the matrix interpreter. (The `justfile`'s top-level `UV_NO_SYNC`
    # export auto-enables in CI, so `just test` stays on the test-only env from `install-test`
    # without re-syncing — its `--no-default-groups --group test` skips the `docs` group, whose
    # native deps, e.g. Pillow / imaging, are never pulled on macOS / Windows.)
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `Python` ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: just install-test

      - name: Run tests with coverage
        run: just test

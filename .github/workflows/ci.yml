name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs: a new push to the same ref aborts the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up `Python`
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just ci-install

      - name: Run linting
        run: just ci-lint

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # `UV_PYTHON` pins `uv` to the matrix interpreter — otherwise `uv` skips prereleases
    # (like the `3.15` beta) and silently picks a stable one. `UV_NO_SYNC` keeps `uv run`
    # on the test-only env from `ci-install-test` (no `docs` group: `Pillow` has no 3.15 wheel).
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: "1"
      # `pydantic-core` ships no `cp315` wheel yet, so on 3.15 `uv` builds it from source via
      # `cargo`, whose crates.io downloads intermittently fail (transient TLS / unexpected EOF).
      # Make `cargo` retry each download before the step-level retry kicks in.
      CARGO_NET_RETRY: "10"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up `Python` ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Retry the whole install: on 3.15 it builds `pydantic-core` from source, so a flaky
      # crates.io download (not a code fault) shouldn't fail the run. See `CARGO_NET_RETRY` above.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if just ci-install-test; then
              exit 0
            fi
            echo "::warning::Install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Install failed after 3 attempts"
          exit 1

      - name: Run tests with coverage
        run: just ci-test

      - name: Upload coverage to `Codecov`
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}

  # Dependency floor / ceiling: the recipes pin Python and resolution, `uv` provisions the
  # interpreter, so no `setup-python` is needed.
  test-floor:
    name: Test (dependency floor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run tests at the dependency floor
        run: just ci-test-floor

  test-ceil:
    name: Test (dependency ceiling)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run tests at the dependency ceiling
        run: just ci-test-ceil

  audit:
    name: Audit
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just ci-install

      - name: Audit dependencies
        run: just audit

      - name: Audit GitHub Actions workflows
        run: just audit-workflows

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up `Python`
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: Install `uv`
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install `just`
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just ci-install-docs

      - name: Build documentation
        run: just ci-docs-build

  # Single required status check: branch protection points only at this job, so matrix legs
  # can be added/removed without editing protection rules. Fails if any needed job failed.
  check:
    name: CI ok
    if: always()
    needs: [lint, test, test-floor, test-ceil, audit, docs]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Decide whether all jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

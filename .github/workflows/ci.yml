name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs: a new push to the same ref aborts the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `Python`
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: just install-all

      - name: Run linting
        run: just lint

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `UV_PYTHON` pins `uv` to the matrix interpreter — otherwise `uv` skips prereleases
    # (like the `3.15` beta) and silently picks a stable one. (No `UV_NO_SYNC` here: the
    # `justfile`'s top-level `UV_NO_SYNC`/`UV_FROZEN` exports auto-enable in CI, so `just test`
    # runs on the `install-test` env without re-syncing.)
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # `pydantic-core` ships no `cp315` wheel yet, so on 3.15 `uv` builds it from source via
      # `cargo`, whose crates.io downloads intermittently fail (transient TLS / unexpected EOF).
      # Make `cargo` retry each download before the step-level retry kicks in.
      CARGO_NET_RETRY: "10"
    strategy:
      fail-fast: false
      # Canonical Python matrix. Mirrored by `coverage.yml`, `python_versions` in the `justfile`,
      # and (minus the `3.15` prerelease) `os-matrix.yml`. Keep them in sync.
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `Python` ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      # Retry the whole install: on 3.15 it builds `pydantic-core` from source, so a flaky
      # crates.io download (not a code fault) shouldn't fail the run. See `CARGO_NET_RETRY` above.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if just install-test; then
              exit 0
            fi
            echo "::warning::Install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Install failed after 3 attempts"
          exit 1

      - name: Run tests with coverage
        run: just test

      # Coverage is uploaded to `Codecov` from the separate `coverage.yml` (`workflow_run`), which
      # runs in the trusted base-repo context — so fork PRs report coverage without ever exposing
      # `CODECOV_TOKEN` to untrusted PR code. Here we only stash the report as an artifact.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  # Dependency floor / ceiling: the recipes pin Python and resolution, `uv` provisions the
  # interpreter, so no `setup-python` is needed.
  test-floor:
    name: Test (dependency floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Run tests at the dependency floor
        run: just test-floor

  test-ceil:
    name: Test (dependency ceiling)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Run tests at the dependency ceiling
        run: just test-ceil

  audit:
    name: Audit
    # No `needs`: the security audit is independent of lint/test, so it starts immediately and in
    # parallel instead of waiting for them. A CVE surfaces as its own signal even when a test fails,
    # rather than being masked behind an unrelated failure. It is still gated by the `check` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `just install-all`: `trivy` reads `uv.lock` via docker, `zizmor` runs via `uvx`.
      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Scan dependencies for known CVEs
        run: just scan-deps

      - name: Audit GitHub Actions workflows
        run: just audit-workflows

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up `Python`
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Set up `uv` + `just`
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: just install-docs

      - name: Build documentation
        run: just docs-build

  # Single required status check: branch protection points only at this job, so matrix legs
  # can be added/removed without editing protection rules. Fails if any needed job failed.
  check:
    name: CI ok
    if: always()
    needs: [lint, test, test-floor, test-ceil, audit, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Decide whether all jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

# Automated dependency update PRs.
#
# NOTE: Dependabot does NOT respect `uv`'s `tool.uv.exclude-newer` — it always targets the latest
#  release. The two are separate systems that only collide at lock time: Dependabot runs `uv` to
#  update `uv.lock`, and `uv` then refuses any version inside the `exclude-newer` window, producing a
#  broken (unlockable) PR. `uv`'s own docs therefore recommend mirroring the cutoff as a `cooldown`.
#  `cooldown.default-days` is duplicated from `tool.uv.exclude-newer` ("7 days") in `pyproject.toml` —
#  keep the two values in sync. See: https://docs.astral.sh/uv/guides/integration/dependabot/
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Canonical cutoff: `tool.uv.exclude-newer` in `pyproject.toml`. Mirrored here so Dependabot
    #  never opens a PR for a version `uv` would refuse to lock.
    cooldown:
      default-days: 7
    groups:
      # Single weekly PR for all Python dependency bumps instead of one PR each.
      python-dependencies:
        patterns:
          - "*"
      # A group without `applies-to` covers version updates only, so every security update
      #  opened its own PR.
      #  https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups--
      #  Majors stay out of the group: in a group the highest bump decides, so one major would
      #  hold every patch fix back from auto-merge.
      #  https://github.com/dependabot/fetch-metadata/blob/25dd0e34f4fe68f24cc83900b1fe3fe149efef98/src/dependabot/output.ts#L79-L86
      #  While a group PR is open, a major left out of it gets no PR of its own until that PR
      #  closes, unless Dependabot runs its `individual_prs_for_semver_excluded_dependencies`
      #  experiment.
      #  https://github.com/dependabot/dependabot-core/commit/c96ebb6ae58f869c275e4e1d220d3bc00cd28be9
      python-dependencies-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    # `/` scans `.github/workflows/` and a ROOT `action.yml` only, so the composite action at
    #  `.github/actions/setup/action.yml` was never seen: its `setup-uv` pin sat at `v8.2.0` from
    #  the commit that added it while `release.yml`'s duplicate of the same pin was bumped twice.
    #  https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    # `exclude-newer` is a `uv`-only resolver setting and does not cover GitHub Actions, so this is
    #  the *only* supply-chain delay for action bumps. Matched to the Python cutoff for consistency.
    cooldown:
      default-days: 7
    groups:
      # Single weekly PR for all action SHA bumps.
      github-actions:
        patterns:
          - "*"
      # No security group here: GitHub raises Actions alerts for semver references only, and every
      #  third-party action in this repository is pinned to a SHA.
      #  https://docs.github.com/en/code-security/concepts/supply-chain-security/dependabot-alerts

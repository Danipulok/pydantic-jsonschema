name: Set up uv and just
description: Install the pinned uv and just toolchain (single source for both action SHAs; the
  release workflow pins its own uncached copies).

runs:
  using: composite
  steps:
    - name: Install `uv`
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install `just`
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Latest `1.x` on purpose: an npm semver range, where `zizmor` rejects the default `*`
      #  as `unpinned-tools`. https://github.com/extractions/setup-just/blob/53165ef7e734c5c07cb06b3c8e7b647c5aa16db3/README.md#L44-L52
      with:
        just-version: "1"

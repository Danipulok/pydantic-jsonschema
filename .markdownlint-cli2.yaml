# https://github.com/DavidAnson/markdownlint-cli2
# https://github.com/DavidAnson/markdownlint#rules--aliases

globs:
  - "README.md"
  - "RELEASING.md"
  - "SECURITY.md"
  - "examples/README.md"
  - "docs/**/*.md"

config:
  line-length: false

  ul-style:
    style: dash

  emphasis-style:
    style: asterisk

  # Need to indent with 4 spaces to render properly.
  ul-indent:
    indent: 4

  # H1 headings are automatically inserted by mkdocs.
  first-line-h1: false

  # Allow same heading name if the parent is different.
  no-duplicate-heading:
    siblings_only: true

  # Allow inline HTML to support line breaks etc.
  no-inline-html: false

  # Need to disable in order to support PyMdown Tabbed extension and admonitions.
  # https://facelessuser.github.io/pymdown-extensions/extensions/tabbed/
  # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  code-block-style: false

  # Disabled in order to support references to API.
  reference-links-images: false

  # Anchors via attribute lists are not detected, let mkdocs handle anchor validation.
  link-fragments: false
